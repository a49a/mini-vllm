name: correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.87.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Explore lifecycle sequences with a per-run seed
        env:
          MINI_VLLM_LIFECYCLE_SEED: ${{ github.run_id }}
        run: cargo test --locked -p mini-vllm-engine --test state_machine
      - run: cargo run --locked -p mini-vllm-engine --example prefix_metadata
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/check_docs.py
      - name: Preserve reduced lifecycle failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-failures-${{ matrix.os }}
          path: target/lifecycle-failures/
          if-no-files-found: ignore
